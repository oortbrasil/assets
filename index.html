function onGaugeTypeChange(val){
  gaugeTypeSelection=val;
  const container=document.getElementById('rain-gauge-container');
  if(container&&dadosAtivos.length){
    const pluviFiltro={};
    filtrar(dadosAtivos,dadosCombinados).forEach(d=>{const dia=String(d.Date).slice(0,10);const v=parseFloat(d.Pluvi);if(!isNaN(v))pluviFiltro[dia]=v;});
    renderRainGaugeInContainer(container,filtrar(dadosAtivos,dadosCombinados),pluviFiltro,val);
  }
  document.querySelectorAll('.cal-day-tile').forEach(t=>{
    if(val==='barras')t.classList.add('style-bars');
    else t.classList.remove('style-bars');
  });
}

function renderCalRollingWindow(){
  const grid=document.getElementById('cal-days-grid');if(!grid)return;
  grid.innerHTML='';
  calTileElements=[];

  const anchorDate=keyToDate(calAnchorDateKey);
  const centerDate=addDaysToDate(anchorDate,calWindowOffsetWeeks*7);

  // Domingo da semana central (linha 3 de 5 -> índice de semana 2)
  const centerWeekSunday=addDaysToDate(centerDate,-centerDate.getDay());
  // Início da grade de 35 dias: 2 semanas completas antes do domingo da semana central
  const startDate=addDaysToDate(centerWeekSunday,-14);
  const endDate=addDaysToDate(startDate,34);

  // Atualiza cabeçalho de período / meses abrangidos
  const mIni=MESES_CURTOS[startDate.getMonth()],mFim=MESES_CURTOS[endDate.getMonth()];
  const yIni=startDate.getFullYear(),yFim=endDate.getFullYear();
  let labelTopo='';
  if(mIni===mFim&&yIni===yFim)labelTopo=`${MESES_LONGOS[startDate.getMonth()]} ${yIni}`;
  else if(yIni===yFim)labelTopo=`${mIni} – ${mFim} ${yFim}`;
  else labelTopo=`${mIni} ${yIni} – ${mFim} ${yFim}`;
  document.getElementById('cal-month-lbl').textContent=labelTopo;

  const subEl=document.getElementById('cal-window-sub');
  if(subEl){
    subEl.textContent=`${String(startDate.getDate()).padStart(2,'0')}/${String(startDate.getMonth()+1).padStart(2,'0')} a ${String(endDate.getDate()).padStart(2,'0')}/${String(endDate.getMonth()+1).padStart(2,'0')}`;
  }

  // Botões de navegação: bloqueia avançar além da janela centrada em Hoje
  const nextBtn=document.getElementById('cal-next');
  const todayBtn=document.getElementById('cal-today-btn');
  if(nextBtn)nextBtn.disabled=(calWindowOffsetWeeks>=0);
  if(todayBtn)todayBtn.classList.toggle('is-centered',calWindowOffsetWeeks===0);

  // Calcula acumulados dos dias válidos (<= calAnchorDateKey) visíveis na janela e máximo p/ escala
  let windowTotal=0,windowRainyDays=0,maxMm=0,validDaysCount=0;
  const daysList=[];

  for(let i=0;i<35;i++){
    const d=addDaysToDate(startDate,i);
    const key=dateToKey(d);
    const isFuture=key>calAnchorDateKey;
    const isToday=key===calAnchorDateKey;
    const mm=isFuture?0:(calPluviData[key]||0);

    if(!isFuture){
      validDaysCount++;
      if(mm>0){windowTotal+=mm;windowRainyDays++;}
      if(mm>maxMm)maxMm=mm;
    }
    daysList.push({d,key,mm,isFuture,isToday,idx:i});
  }

  document.getElementById('cal-month-total').textContent=`${windowTotal.toFixed(1)} mm (${validDaysCount}d)`;
  document.getElementById('cal-month-rainy').textContent=`${windowRainyDays} ${windowRainyDays===1?'dia':'dias'}`;

  let prevMonth=-1;

  daysList.forEach((item,i)=>{
    const {d,key,mm,isFuture,isToday}=item;
    const row=Math.floor(i/7);
    const col=i%7;
    const isBarsStyle=gaugeTypeSelection==='barras';

    const slot=document.createElement('div');
    slot.className='cal-day-slot'+(row===2&&calWindowOffsetWeeks===0?' slot-current-week':'');

    const tile=document.createElement('div');
    tile.className='cal-day-tile'
      +(isBarsStyle?' style-bars':'')
      +(isToday?' cal-is-today':'')
      +(isFuture?' cal-future':'');
    tile.dataset.dateKey=key;
    tile.dataset.mm=mm;

    // Exibe etiqueta do mês no 1º card da grade ou sempre que o mês vira (ex: 01 Nov)
    const curMonth=d.getMonth();
    const showMonthTag=(i===0||curMonth!==prevMonth);
    prevMonth=curMonth;
    const monthTagHTML=showMonthTag?`<span class="cal-day-month-tag">${MESES_CURTOS[curMonth]}</span>`:'';
    const todayPillHTML=isToday?`<span class="cal-today-pill">HOJE</span>`:'';

    if(isFuture){
      tile.title='Data futura — ainda não registrada';
      tile.setAttribute('aria-disabled','true');
      tile.innerHTML=
        monthTagHTML+
        `<span class="cal-day-num">${String(d.getDate()).padStart(2,'0')}</span>`+
        `<span class="cal-day-mm">—</span>`;
      slot.appendChild(tile);
      grid.appendChild(slot);
      return;
    }

    const vis=computeCalTileVisuals(mm,maxMm);
    tile.style.setProperty('--size-pct','58%');
    tile.style.setProperty('--tile-radius',vis.radius+'px');
    tile.style.setProperty('--tile-bg',vis.bg);
    tile.style.setProperty('--tile-border',vis.border);
    tile.style.setProperty('--tile-shadow',vis.shadow);
    tile.style.setProperty('--water-level','0%');
    tile.style.setProperty('--liquid-grad',vis.liquidGrad);
    tile.style.setProperty('--num-size',vis.numSize);
    tile.style.setProperty('--mm-opacity',vis.mmOpacity);
    tile.style.setProperty('--droplet-opacity',vis.dropletOpacity);

    tile.innerHTML=
      '<div class="cal-liquid-fill"></div>'+
      '<div class="cal-bar-fill"></div>'+
      '<div class="cal-tile-drops"></div>'+
      monthTagHTML+
      todayPillHTML+
      `<span class="cal-day-num">${String(d.getDate()).padStart(2,'0')}</span>`+
      `<span class="cal-day-mm">${mm>0?mm.toFixed(1)+'mm':(isToday?'0mm':'')}</span>`;

    slot.appendChild(tile);
    grid.appendChild(slot);

    const tRef={el:tile,mm,dateKey:key,row,col,isFuture:false};
    calTileElements.push(tRef);

    const delay=i*8;
    setTimeout(()=>{
      tile.style.setProperty('--size-pct',vis.sizePct+'%');
      tile.style.setProperty('--water-level',vis.waterLevel+'%');
      tile.style.setProperty('--bar-h',vis.waterLevel+'%');
    },delay);

    tile.addEventListener('pointerenter',()=>{applyCalRepulsion(tRef);selectCalDay(key,mm);});
    tile.addEventListener('click',()=>selectCalDay(key,mm));
  });

  grid.onpointerleave=resetCalRepulsion;

  // Seleciona automaticamente o dia atual (Hoje) ou o último dia válido da janela
  const targetKey=(calSelectedDateKey&&calSelectedDateKey<=calAnchorDateKey&&daysList.some(x=>x.key===calSelectedDateKey))
    ?calSelectedDateKey
    :(daysList.some(x=>x.key===calAnchorDateKey)?calAnchorDateKey:daysList.filter(x=>!x.isFuture).slice(-1)[0]?.key);

  if(targetKey){
    const mmSel=calPluviData[targetKey]||0;
    selectCalDay(targetKey,mmSel);
  }

  if(calStageEl&&calRainCanvas){
    calRainCanvas.width=calStageEl.clientWidth;
    calRainCanvas.height=calStageEl.clientHeight;
  }
}

function computeCalTileVisuals(mm,maxMm){
  if(mm<=0){return{sizePct:74,radius:12,bg:'rgba(14,30,46,0.55)',border:'rgba(255,255,255,0.07)',shadow:'0 3px 8px rgba(0,0,0,0.25)',waterLevel:0,liquidGrad:'transparent',numSize:'.78rem',mmOpacity:0.75,dropletOpacity:0};}
  const refMax=Math.max(maxMm,80);
  const norm=Math.min(1,Math.pow(mm/refMax,0.6));
  const sizePct=Math.round(78+norm*20);const radius=Math.round(12+norm*6);const waterLevel=Math.round(22+norm*78);
  let bg,border,shadow,liquidGrad;
  if(mm<15){bg='rgba(0,100,120,0.35)';border='rgba(0,200,180,0.35)';shadow='0 5px 12px rgba(0,180,160,0.2)';liquidGrad='linear-gradient(180deg,rgba(0,229,176,0.4),rgba(0,180,140,0.65))';}
  else if(mm<45){bg='rgba(0,80,160,0.45)';border='rgba(0,180,220,0.6)';shadow='0 8px 18px rgba(0,160,220,0.35)';liquidGrad='linear-gradient(180deg,rgba(0,200,230,0.65),rgba(0,140,200,0.88))';}
  else{bg='rgba(20,40,120,0.6)';border='rgba(120,180,255,0.85)';shadow='0 10px 24px rgba(80,140,255,0.5)';liquidGrad='linear-gradient(180deg,rgba(140,200,255,0.8) 0%,rgba(60,120,220,0.95) 55%,rgba(80,60,220,0.95) 100%)';}
  return{sizePct,radius,bg,border,shadow,waterLevel,liquidGrad,numSize:(0.8+norm*0.14).toFixed(2)+'rem',mmOpacity:1,dropletOpacity:norm>0.4?(norm*0.8).toFixed(2):0};
}

function applyCalRepulsion(hovered){
  calTileElements.forEach(item=>{
    if(item===hovered){item.el.style.setProperty('--hover-scale','1.09');item.el.style.setProperty('--push-x','0px');item.el.style.setProperty('--push-y','0px');return;}
    const dCol=item.col-hovered.col,dRow=item.row-hovered.row,dist=Math.hypot(dCol,dRow);
    if(dist>0&&dist<=1.8){const force=(2-dist)*3.5;item.el.style.setProperty('--push-x',(dCol/dist*force).toFixed(1)+'px');item.el.style.setProperty('--push-y',(dRow/dist*force).toFixed(1)+'px');item.el.style.setProperty('--hover-scale','0.96');}
    else{item.el.style.setProperty('--push-x','0px');item.el.style.setProperty('--push-y','0px');item.el.style.setProperty('--hover-scale','1');}
  });
}
function resetCalRepulsion(){calTileElements.forEach(t=>{t.el.style.setProperty('--push-x','0px');t.el.style.setProperty('--push-y','0px');t.el.style.setProperty('--hover-scale','1');});}

function selectCalDay(dateKey,mm){
  if(dateKey>calAnchorDateKey)return; // Nunca seleciona datas futuras
  calSelectedDateKey=dateKey;
  calTileElements.forEach(t=>t.el.classList.toggle('cal-selected',t.dateKey===dateKey));
  const d=keyToDate(dateKey);
  const ehHoje=(dateKey===calAnchorDateKey);
  document.getElementById('cal-insp-date').textContent=`${ehHoje?'HOJE · ':''}DIA ${String(d.getDate()).padStart(2,'0')} • ${MESES_CURTOS[d.getMonth()]} ${d.getFullYear()}`;
  document.getElementById('cal-hero-val').textContent=mm>0?mm.toFixed(1):'0';
  document.getElementById('cal-hero-unit').textContent='mm';

  const statusEl=document.getElementById('cal-insp-status');
  const descEl=document.getElementById('cal-insp-desc');
  const gaugePct=Math.min(100,Math.round((mm/80)*100));
  document.getElementById('cal-gauge-pct').textContent=mm>0?(gaugePct+'% do ref.'):'Tempo Seco';
  document.getElementById('cal-gauge-fill').style.width=gaugePct+'%';

  if(mm===0){
    statusEl.innerHTML='☀️ Sem Chuva';descEl.textContent='Nenhuma precipitação registrada pela estação nesta data.';
    calTargetIntensity=0;if(calStageEl){calStageEl.classList.add('cal-sunny');calStageEl.classList.remove('cal-rainy');}
  }else if(mm<15){
    statusEl.innerHTML='🌦️ Chuva Leve';descEl.textContent='Precipitação leve registrada. Favorável à manutenção da umidade superficial do solo.';
    calTargetIntensity=0.3;if(calStageEl){calStageEl.classList.remove('cal-sunny');calStageEl.classList.add('cal-rainy');}
  }else if(mm<45){
    statusEl.innerHTML='🌧️ Chuva Expressiva';descEl.textContent='Bom volume hídrico acumulado nas leituras da estação.';
    calTargetIntensity=0.65;if(calStageEl){calStageEl.classList.remove('cal-sunny');calStageEl.classList.add('cal-rainy');}
  }else{
    statusEl.innerHTML='⛈️ Chuva Intensa';descEl.textContent='Volume elevado de precipitação diária. Monitore a saturação do solo.';
    calTargetIntensity=1.0;if(calStageEl){calStageEl.classList.remove('cal-sunny');calStageEl.classList.add('cal-rainy');}
  }

  // Telemetria real da estação para a data selecionada (incluindo dias do mês anterior)
  const dayData=calDadosRef.filter(r=>String(r.Date).slice(0,10)===dateKey);
  if(dayData.length){
    const tmins=dayData.map(r=>filterTemp(r.TempAr)).filter(isFinite);
    const umis=dayData.map(r=>filterVal(r.UmiAr)).filter(isFinite);
    const presses=dayData.map(r=>filterPress(r.Press)).filter(isFinite);
    document.getElementById('cal-tele-tmin').textContent=tmins.length?Math.min(...tmins).toFixed(1)+'°C':'—';
    document.getElementById('cal-tele-tmax').textContent=tmins.length?Math.max(...tmins).toFixed(1)+'°C':'—';
    document.getElementById('cal-tele-umi').textContent=umis.length?Math.round(umis.reduce((a,b)=>a+b)/umis.length)+'%':'—';
    document.getElementById('cal-tele-press').textContent=presses.length?Math.round(presses.reduce((a,b)=>a+b)/presses.length)+' hPa':'—';
  }else{
    ['cal-tele-tmin','cal-tele-tmax','cal-tele-umi','cal-tele-press'].forEach(id=>document.getElementById(id).textContent='—');
  }
}

/* ── Calendar Rain Animation ── */
function initCalRain(){
  if(!calStageEl)return;
  calRainCanvas.width=calStageEl.clientWidth||600;calRainCanvas.height=calStageEl.clientHeight||400;
  calDrops=[];
  for(let i=0;i<60;i++){
    const z=Math.random();
    calDrops.push({x:Math.random()*calRainCanvas.width,y:Math.random()*calRainCanvas.height,z,len:10+z*14,vy:6+z*7,vx:-0.4-z*0.3,alpha:0.12+z*0.3});
  }
}
function animateCalRain(){
  if(!calRainCtx||!calRainCanvas.width)return;
  calRainIntensity+=(calTargetIntensity-calRainIntensity)*0.05;
  calRainCtx.clearRect(0,0,calRainCanvas.width,calRainCanvas.height);
  if(calRainIntensity>0.03){
    calRainCtx.lineCap='round';
    for(const d of calDrops){
      d.x+=d.vx;d.y+=d.vy*(0.6+calRainIntensity*0.5);
      if(d.y>calRainCanvas.height+20){d.y=-15;d.x=Math.random()*calRainCanvas.width;}
      if(d.x<-5)d.x=calRainCanvas.width+5;
      const eff=d.alpha*calRainIntensity;
      const g=calRainCtx.createLinearGradient(d.x,d.y-d.len,d.x,d.y);
      g.addColorStop(0,'rgba(180,220,255,0)');g.addColorStop(1,'rgba(180,220,255,'+eff+')');
      calRainCtx.strokeStyle=g;calRainCtx.lineWidth=d.z>0.6?1.4:0.9;
      calRainCtx.beginPath();calRainCtx.moveTo(d.x-d.vx,d.y-d.len);calRainCtx.lineTo(d.x,d.y);calRainCtx.stroke();
    }
  }
  calRafId=requestAnimationFrame(animateCalRain);
}

/* ═══════════════════════════════════════════════════════
   GLOBAL ATMOSPHERE
   ═══════════════════════════════════════════════════════ */
const globalSkyCanvas=document.getElementById('global-sky-canvas');
const globalRainCanvas=document.getElementById('global-rain-canvas');
const globalSkyCtx=globalSkyCanvas.getContext('2d');
const globalRainCtx=globalRainCanvas.getContext('2d');
let globalRainDrops=[];
let globalClouds=[];
let globalRainIntensity=0;
let globalTargetIntensity=0;
let globalAtmosphereMode='neutral';

function setGlobalAtmosphere(mode,intensity=0){
  globalAtmosphereMode=mode;
  globalTargetIntensity=intensity;
}

function resizeGlobalCanvases(){
  globalSkyCanvas.width=window.innerWidth;globalSkyCanvas.height=window.innerHeight;
  globalRainCanvas.width=window.innerWidth;globalRainCanvas.height=window.innerHeight;
}
window.addEventListener('resize',resizeGlobalCanvases);resizeGlobalCanvases();

function initGlobalAtmosphere(){
  globalClouds=[];
  for(let i=0;i<5;i++){
    const scale=0.6+Math.random()*0.7;
    globalClouds.push({x:Math.random()*window.innerWidth,y:30+Math.random()*window.innerHeight*0.3,speed:0.2+Math.random()*0.3,alpha:0.3+Math.random()*0.25,puffs:[{ox:0,oy:0,r:40*scale},{ox:-35*scale,oy:8*scale,r:30*scale},{ox:38*scale,oy:7*scale,r:32*scale},{ox:-16*scale,oy:-14*scale,r:28*scale},{ox:18*scale,oy:-12*scale,r:25*scale}]});
  }
  globalRainDrops=[];
  for(let i=0;i<80;i++){
    const z=Math.random();
    globalRainDrops.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,z,len:10+z*15,vy:6+z*8,vx:-0.5-z*0.4,alpha:0.1+z*0.28});
  }
}
initGlobalAtmosphere();

function animateGlobal(){
  globalRainIntensity+=(globalTargetIntensity-globalRainIntensity)*0.04;
  const sunny=globalAtmosphereMode==='sunny'?1:Math.max(0,1-globalRainIntensity*2);

  globalSkyCtx.clearRect(0,0,globalSkyCanvas.width,globalSkyCanvas.height);
  if(sunny>0.05){
    const sg=globalSkyCtx.createRadialGradient(globalSkyCanvas.width*0.85,80,0,globalSkyCanvas.width*0.85,80,350);
    sg.addColorStop(0,'rgba(255,245,200,'+0.12*sunny+')');sg.addColorStop(0.5,'rgba(255,220,100,'+0.05*sunny+')');sg.addColorStop(1,'rgba(255,255,255,0)');
    globalSkyCtx.fillStyle=sg;globalSkyCtx.fillRect(0,0,globalSkyCanvas.width,globalSkyCanvas.height);
  }
  for(const c of globalClouds){
    c.x+=c.speed;if(c.x-200>globalSkyCanvas.width)c.x=-200;
    for(const p of c.puffs){
      const g=globalSkyCtx.createRadialGradient(c.x+p.ox,c.y+p.oy-p.r*.2,p.r*.05,c.x+p.ox,c.y+p.oy,p.r);
      const br=Math.round(40+150*sunny),bg2=Math.round(60+130*sunny),bb=Math.round(80+100*sunny);
      const al=c.alpha*(0.1+0.3*sunny)*(0.2+globalRainIntensity*0.4);
      g.addColorStop(0,'rgba('+br+','+bg2+','+bb+','+al+')');g.addColorStop(0.6,'rgba('+br+','+bg2+','+bb+','+(al*.3)+')');g.addColorStop(1,'rgba('+br+','+bg2+','+bb+',0)');
      globalSkyCtx.fillStyle=g;globalSkyCtx.beginPath();globalSkyCtx.arc(c.x+p.ox,c.y+p.oy,p.r,0,Math.PI*2);globalSkyCtx.fill();
    }
  }

  globalRainCtx.clearRect(0,0,globalRainCanvas.width,globalRainCanvas.height);
  if(globalRainIntensity>0.04){
    globalRainCtx.lineCap='round';
    for(const d of globalRainDrops){
      d.x+=d.vx;d.y+=d.vy*(0.6+globalRainIntensity*0.45);
      if(d.y>globalRainCanvas.height+20){d.y=-15;d.x=Math.random()*globalRainCanvas.width;}
      if(d.x<-5)d.x=globalRainCanvas.width;
      const eff=d.alpha*globalRainIntensity;
      const g=globalRainCtx.createLinearGradient(d.x,d.y-d.len,d.x,d.y);
      g.addColorStop(0,'rgba(180,220,255,0)');g.addColorStop(1,'rgba(180,220,255,'+eff+')');
      globalRainCtx.strokeStyle=g;globalRainCtx.lineWidth=d.z>0.6?1.3:0.8;
      globalRainCtx.beginPath();globalRainCtx.moveTo(d.x,d.y-d.len);globalRainCtx.lineTo(d.x,d.y);globalRainCtx.stroke();
    }
  }
  requestAnimationFrame(animateGlobal);
}
animateGlobal();

/* ── Neon chart factory ── */
function makeChart(id,labels,datasets,yLabel,dual){
  const el=document.getElementById(id);if(!el)return null;
  const ctx=el.getContext('2d');
  const gridColor='rgba(0,229,176,0.06)';const tickColor='#4a7080';
  const sc={
    x:{type:'time',time:{tooltipFormat:'dd/MM HH:mm',displayFormats:{hour:'HH:mm',day:'dd/MM'}},ticks:{color:tickColor,maxTicksLimit:6,maxRotation:0,font:{size:10}},grid:{color:gridColor}},
    y:{ticks:{color:tickColor,font:{size:10}},grid:{color:gridColor},title:{display:!!yLabel,text:yLabel,color:tickColor,font:{size:10}}}
  };
  if(dual)sc.y1={position:'right',ticks:{color:'#4db8a0',font:{size:10}},grid:{drawOnChartArea:false}};
  return new Chart(ctx,{type:'line',data:{labels,datasets},options:{
    responsive:true,maintainAspectRatio:true,aspectRatio:2.8,
    interaction:{intersect:false,mode:'index'},
    plugins:{
      legend:{display:!!dual,labels:{color:tickColor,font:{size:10},boxWidth:10}},
      tooltip:{backgroundColor:'rgba(10,22,34,0.95)',borderColor:gridColor,borderWidth:1,titleColor:'#e0f4ff',bodyColor:tickColor,padding:8}
    },
    scales:sc
  }});
}

/* ── Utility functions ── */
function fmt(v){const n=filterVal(v);return isNaN(n)?'-':n.toFixed(1);}
function fmt0(v){const n=parseFloat(v);return isNaN(n)?'-':Math.round(n);}
function fmt1(v){const n=parseFloat(v);return isNaN(n)?'-':n.toFixed(1);}
function formatarPeriodo(nome){const p=String(nome).split('-');if(p.length<2)return esc(nome);return['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][parseInt(p[1],10)-1]+' '+p[0];}
function calcularBaselineGas(valores){if(!valores||!valores.length)return NaN;const s=[...valores].filter(v=>isFinite(v)&&v>0).sort((a,b)=>a-b);if(!s.length)return NaN;const pos=(s.length-1)*.9,lo=Math.floor(pos),hi=Math.ceil(pos);return lo===hi?s[lo]:s[lo]+(s[hi]-s[lo])*(pos-lo);}
function gasResistanceToIAQ(gasOhm,baselineOhm){const g=parseFloat(gasOhm),b=parseFloat(baselineOhm);if(!isFinite(g)||g<=0||!isFinite(b)||b<=0)return NaN;const r=Math.max(.03,Math.min(1.2,g/b));const pts=[[1.2,0],[1,25],[.8,50],[.6,100],[.4,150],[.25,200],[.12,300],[.05,400],[.03,500]];for(let i=0;i<pts.length-1;i++){const[r1,q1]=pts[i],[r2,q2]=pts[i+1];if(r<=r1&&r>=r2){const t=(r1-r)/(r1-r2);return Math.round(q1+(q2-q1)*t);}}return r>=1.2?0:500;}
function fmtGas(v){const n=parseFloat(v);if(!isFinite(n))return'—';return n>=1000?(n/1000).toFixed(2)+' kΩ':Math.round(n)+' Ω';}
function iaqLabel(v){if(!isFinite(v))return'Sem dados';if(v<=50)return'Bom';if(v<=100)return'Médio';if(v<=150)return'Pouco saudável';if(v<=200)return'Ruim';if(v<=300)return'Muito ruim';return'Péssimo';}
function iaqColor(v){if(!isFinite(v))return'#5a8099';if(v<=50)return'#00e5b0';if(v<=100)return'#b7d653';if(v<=150)return'#f0e060';if(v<=200)return'#f0a500';if(v<=300)return'#e05c5c';return'#cc0000';}
function uvLabel(v){if(v<=2)return'Baixo';if(v<=5)return'Moderado';if(v<=7)return'Alto';if(v<=10)return'Muito Alto';return'Extremo';}
function mostrarLoading(){document.getElementById('app-body').innerHTML='<div class="state-msg"><div class="spinner"></div><p>Carregando dados…</p></div>';}
function mostrarErro(msg){document.getElementById('app-body').innerHTML='<div class="state-msg"><div class="icon">⚠️</div><p>'+msg+'</p></div>';}
function mostrarVazio(msg){document.getElementById('app-body').innerHTML='<div class="state-msg"><div class="icon">📭</div><p>'+msg+'</p></div>';}
function destroyCharts(){chartInstances.forEach(c=>{if(c)c.destroy();});chartInstances=[];}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}
function jsStr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');}

registrarServiceWorker();
init().finally(()=>iniciarMonitorNotificacoes());
</script>
